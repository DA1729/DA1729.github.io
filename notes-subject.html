    <h2 id="subject-heading">Notes</h2>
    <p><a href="notes.html">&larr; All subjects</a></p>

    <div id="notes-root">
        <p><em>Loading&hellip;</em></p>
    </div>

    <footer>
        <p><small>&copy; 2026 Daksh Pandey. Built using Claude Code.</small></p>
        <p><small><a href="https://github.com/DA1729" target="_blank">GitHub</a> &middot; <a href="mailto:daksh_p@ph.iitr.ac.in">Email</a></small></p>
    </footer>

    <script>
        (async () => {
            const params = new URLSearchParams(window.location.search);
            const subject = params.get("subject") || "";
            const root = document.getElementById("notes-root");

            if (!subject) {
                document.getElementById("subject-heading").textContent = "Notes";
                root.innerHTML = '<p><em>No subject specified.</em> <a href="notes.html">Browse all subjects.</a></p>';
                return;
            }

            document.getElementById("subject-heading").textContent = subject;
            document.title = `${subject} — Daksh`;

            const res = await fetch("notes.json");
            const entries = await res.json();

            // Notes for this subject, newest first.
            const items = entries
                .filter(e => (e.subject || "Other") === subject)
                .sort((a, b) => b.date.localeCompare(a.date));

            root.innerHTML = "";

            if (items.length === 0) {
                root.innerHTML = '<p><em>No notes in this subject yet.</em> <a href="notes.html">Browse all subjects.</a></p>';
                return;
            }

            const ul = document.createElement("ul");
            ul.className = "post-list";
            for (const e of items) {
                const li = document.createElement("li");
                li.innerHTML = `
                    <a class="post-title" href="post.html?post=${encodeURIComponent(e.slug)}&kind=note">${escapeHtml(e.title)}</a>
                    <div class="post-meta">${formatDate(e.date)}</div>
                    <div>${escapeHtml(e.description || "")}</div>
                `;
                ul.appendChild(li);
            }
            root.appendChild(ul);
        })();
    </script>
</body>
</html>
